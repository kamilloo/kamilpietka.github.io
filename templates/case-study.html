<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$seo_title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$url">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$seo_title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$url">
  <meta property="og:site_name" content="Kamil Piętka">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="$seo_title">
  <meta name="twitter:description" content="$description">
  <script type="application/ld+json">$structured_data</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="case-page">
<a class="skip-link button" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="/#top" aria-label="KP — Kamil Piętka homepage">KP</a>
    <nav aria-label="Primary navigation">
      <a href="/#projects">Projects</a>
      <a href="/#about">About</a>
      <a href="https://github.com/kamilloo">GitHub</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap case-study">
  <article>
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a> / <span aria-current="page">$title</span></nav>
    <header>
      <p class="eyebrow">$category</p>
      <h1>$title</h1>
      <p class="lead">$summary</p>
      <div class="stack" aria-label="Project technologies">$tags</div>
      <div class="actions">$links</div>
    </header>
    $sections
    <section aria-labelledby="sources"><h2 id="sources">Source evidence</h2><div class="project-links">$sources</div></section>
  </article>
  <section aria-labelledby="related"><h2 id="related">Related projects</h2><div class="strength-grid">$related</div></section>
  <nav class="project-links case-navigation" aria-label="Case study navigation">
    <a href="/#projects">← Back to projects</a>
    <a href="$next_url">Next: $next_title →</a>
    <a href="/#contact">Contact</a>
  </nav>
</main>
<footer class="wrap footer"><p>© 2026 Kamil Piętka</p><a href="https://github.com/kamilloo">github.com/kamilloo ↗</a></footer>
</body>
</html>
