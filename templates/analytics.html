<div id="analytics-consent" data-measurement-id="$measurement_id" data-project="$project" hidden>
  <button class="button" id="analytics-settings" type="button" aria-controls="analytics-options" aria-expanded="false">Analytics settings</button>
  <div id="analytics-options" role="group" aria-label="Analytics cookie choices" hidden>
    <p>Allow Google Analytics cookies to measure visits and link clicks?</p>
    <button class="button" type="button" data-analytics-choice="granted">Accept analytics</button>
    <button class="button" type="button" data-analytics-choice="denied">Reject analytics</button>
  </div>
</div>
<script src="/analytics.js" defer></script>
