<section id="analytics-consent" class="consent-banner" aria-labelledby="analytics-title" aria-describedby="analytics-description" data-measurement-id="$measurement_id" data-project="$project" hidden>
  <div class="consent-banner__message">
    <svg class="consent-banner__icon" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <div>
      <h2 id="analytics-title" tabindex="-1">Help me improve this portfolio</h2>
      <p id="analytics-description">I use Google Analytics cookies to see which projects visitors find useful. Your choice is optional, and you can change it anytime.</p>
    </div>
  </div>
  <div class="consent-banner__actions">
    <button class="button" type="button" data-analytics-choice="granted">Accept analytics</button>
    <button class="button" type="button" data-analytics-choice="denied">Reject analytics</button>
  </div>
</section>
<script src="/analytics.js" defer></script>
